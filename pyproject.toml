[project]
name = "gazzette-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.7.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.112.1",
    "fastapi-cache2>=0.2.2",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "procrastinate>=2.0.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2.0",
    "python-decouple>=3.8",
    "redis>=5.0.8",
    "requests>=2.32.3",
    "tortoise-orm>=0.21.6",
    "uvicorn[standard]>=0.30.6",
    "selectolax>=0.4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["pg_data", "tests/fixtures"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
# Line length is enforced by the formatter
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
